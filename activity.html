<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>活動状況・送信準備｜Recruiting CRM</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><link rel="stylesheet" href="activity.css"><script src="activity.js" defer></script></head><body><header><a href="index.html">← 候補校に戻る</a><h1>活動状況・送信準備</h1><p>送信 → 閲覧反応 → 返信 → 学校の進捗</p></header><main><p id="message" role="status">データを読み込んでいます…</p><div id="app" hidden><div class="toolbar"><label>活動<select id="campaign"></select></label><label>集計単位<select id="unit"><option value="school">学校</option><option value="coach">コーチ</option></select></label><label>送信段階<select id="stage"><option value="initial">初回メール</option><option value="follow_up_1">Follow-up 1</option><option value="follow_up_2">Follow-up 2</option></select></label><button id="refresh">表示を更新</button><button id="sync-replies">Gmail返信を取り込む</button></div><p id="scope"></p><nav><button id="overview">活動状況</button><button id="prepare">送信準備</button><a href="index.html?area=active">返信済み学校・過去のやり取り</a></nav><section id="stats"><div id="charts" class="charts"></div><p>反応の円グラフはYouTube → Profile → 開封の兆候の順に1区分へ集計。重複を含む各反応の実数も表示します。「反応未検知」は未読の証明ではありません。</p></section><section><div class="toolbar"><label>学校・コーチを検索<input id="search" type="search"></label><label>表示<select id="filter"><option value="all">すべて</option><option value="ready">宛先あり・除外理由なし</option><option value="review">要確認</option></select></label><button id="clear">グラフの絞り込みを解除</button></div><p id="result"></p><div id="list"></div></section></div></main><dialog id="detail"><div class="dialog-head"><h2 id="detail-title"></h2><button id="close">閉じる ×</button></div><div id="detail-body"></div></dialog></body></html>
