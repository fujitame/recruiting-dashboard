<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Activity scope UI fixture</title><link rel="stylesheet" href="../recruiting-activity-scope.css"><style>body{font:14px/1.6 system-ui;margin:16px;color:#18365b;background:#f4f7fb}button{padding:8px;border:1px solid #bac9d9;border-radius:6px;background:white;cursor:pointer}[hidden]{display:none!important}aside{border:2px solid #c5d5e5;background:white;padding:12px}h2{font-size:20px}.crm-empty{padding:16px}.scope-toolbar{display:flex;gap:8px;flex-wrap:wrap}</style>
<h1>活動区分のUI確認</h1><p>模擬データ・Gmail/DB接続なし・送信不可。過去のFU回数2を今回に混ぜないことを確認します。</p>
<nav class="scope-toolbar"><button id="show-history">連絡履歴</button><button id="show-coaches">コーチ詳細</button><button id="show-reservations">予約・送信記録</button></nav>
<div data-scope-toolbar class="activity-scope-tools"><label>活動<select data-correspondence-scope></select></label><button data-scope-refresh>更新</button><p data-scope-note></p></div>
<section id="history-pane"><b id="outreach-area-count"></b><b id="nav-count-outreach"></b><div id="outreach-school-list"></div></section>
<section id="coach-pane" hidden><div id="crm-legacy-overview">旧累積UI</div><div id="crm-scoped-overview"></div></section>
<section id="reservation-pane" hidden><button id="crm-tab-reservations">予約・送信記録</button><div id="crm-legacy-reservations">旧予約</div><div id="crm-scoped-reservations"></div></section>
<div id="crm-legacy-interest" hidden></div><div id="crm-scoped-interest" hidden></div>
<aside id="crm-drawer" hidden><button id="close-drawer">閉じる</button><div class="coach-overview-facts">累積情報</div><div id="crm-activity-context"></div><details id="crm-history-section" open><summary id="crm-history-summary">履歴</summary><div id="crm-history-list"></div></details></aside>
<script src="../recruiting-activity-scope.js"></script><script>
const campaign={id:'new',name:'今回の再アプローチ',campaign_key:'new',created_at:'2026-11-13'},contacts=[{id:'hc',university_id:1,coach_name:'Head Example',coach_role:'head_coach',coach_email:'shared@example.edu',contact_status:'no_response',contact_count:3,follow_up_count:2,last_contact_at:'2026-10-20'},{id:'ac',university_id:1,coach_name:'Assistant Example',coach_role:'assistant_coach',coach_email:'shared@example.edu',contact_status:'no_response',contact_count:3,follow_up_count:2,last_contact_at:'2026-10-20'}],schools=[{id:1,name:'Example University',fav:true}];
const histories=[{id:'old',contact_id:'hc',event_type:'follow_up_sent',event_at:'2026-10-20T00:00:00Z',note:'過去のFollow-up 2',gmail_message_id:'old-message'},{id:'common',contact_id:'hc',event_type:'note',event_at:'2026-11-13T00:00:00Z',note:'活動未分類の共通メモ'}];
const tables={recruiting_campaigns:[campaign],recruiting_campaign_contacts:contacts.map(c=>({campaign_id:'new',contact_id:c.id})),recruiting_campaign_messages:[],recruiting_campaign_deliveries:[],recruiting_campaign_schools:[],recruiting_contact_history:histories,recruiting_activity_records:[{id:'label',history_id:'old',gmail_message_id:'old-message',activity_scope:'legacy'}],recruiting_email_tracking:[{id:'old-track',contact_id:'hc',university_id:1,status:'sent',gmail_message_id:'old-message',stage:'follow_up_2',sent_at:'2026-10-20T00:00:00Z',first_open_at:'2026-10-20T01:00:00Z'}],recruiting_initial_email_jobs:[],recruiting_followup_batch_items:[{id:'old-reservation',mode:'production',contact_id:'hc',university_id:1,status:'sent',expected_follow_up_count:1,scheduled_at:'2026-10-20T00:00:00Z',sent_at:'2026-10-20T00:00:00Z',recipient_email:'shared@example.edu'}],recruiting_inbound_leads:[],recruiting_campaign_issues:[]};
const client={from(table){return {select(){return this},eq(key,value){if(key!=='owner_user_id'||value!=='fixture')throw Error('Unexpected owner');return this},order(){return this},async range(a,b){return {data:structuredClone((tables[table]||[]).slice(a,b+1)),error:null}}}}};
const ui=window.CRMActivityUI;ui.configure({client:()=>client,owner:()=> 'fixture',isTest:()=>false,contacts:()=>contacts,schools:()=>schools,outreachFilter:()=> 'all',schoolName:u=>u.name,openContact:id=>{document.getElementById('crm-drawer').hidden=false;ui.onContact(contacts.find(c=>c.id===id),'crm');ui.renderHistory(histories.filter(h=>h.contact_id===id));},openPreparation(){alert('UI fixture: no navigation or sending')},cancelLegacy(){throw Error('UI fixture does not cancel real mail')}});
function show(id){['history-pane','coach-pane','reservation-pane'].forEach(p=>document.getElementById(p).hidden=p!==id);ui.onArea(id==='history-pane'?'outreach':'crm');}
document.getElementById('show-history').onclick=()=>show('history-pane');document.getElementById('show-coaches').onclick=()=>show('coach-pane');document.getElementById('show-reservations').onclick=()=>show('reservation-pane');document.getElementById('close-drawer').onclick=()=>document.getElementById('crm-drawer').hidden=true;ui.onArea('outreach');
</script></html>
