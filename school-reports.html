function printLayoutCss(){
  function walk(rules){return [...rules].map(rule=>{
    if(rule.type===CSSRule.MEDIA_RULE)return /(^|[,\s])print([,\s]|$)/i.test(rule.conditionText)?walk(rule.cssRules):'';
    return rule.cssText;
  }).join('\n');}
  return [...document.styleSheets].map(sheet=>{try{return walk(sheet.cssRules);}catch{return '';}}).join('\n');
}
async function prepareReportPrint(id){

  `;
  doc.open();doc.write('<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>学校評価シート</title><style>'+printLayoutCss()+overrides+'</style></head><body></body></html>');doc.close();
  for(const article of articles){const paper=doc.createElement('div');paper.className='print-paper';const copy=doc.importNode(article,true);copy.classList.remove('print-hide');const content=doc.createElement('div');content.className='print-content';content.appendChild(copy);paper.appendChild(content);doc.body.appendChild(paper);}
  await doc.fonts.ready;
  await Promise.all([...doc.images].map(img=>img.complete?(img.decode?img.decode().catch(()=>{}):Promise.resolve()):new Promise(resolve=>{img.onload=resolve;img.onerror=resolve;setTimeout(resolve,8000);})));
  // Reading dimensions below forces layout after fonts and images are ready.
  await Promise.resolve();
  for(const paper of doc.querySelectorAll('.print-paper')){
    const sheet=paper.querySelector('.sheet'),style=frame.contentWindow.getComputedStyle(paper);
    const availableHeight=paper.clientHeight-parseFloat(style.paddingTop)-parseFloat(style.paddingBottom)-2;
    const availableWidth=paper.clientWidth-parseFloat(style.paddingLeft)-parseFloat(style.paddingRight)-2;
    const rect=sheet.getBoundingClientRect();
    const children=[...sheet.querySelectorAll('*')].map(e=>e.getBoundingClientRect()).filter(r=>r.width&&r.height);
    const height=Math.max(rect.height,sheet.scrollHeight,...children.map(r=>r.bottom-rect.top));
    const width=Math.max(rect.width,sheet.scrollWidth,...children.map(r=>r.right-rect.left));
    const scale=Math.min(1,availableHeight/height,availableWidth/width);
    if(!Number.isFinite(scale)||scale<=0)throw new Error('印刷レイアウトを計算できませんでした。');
